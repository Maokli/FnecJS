<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FnecJS vs React Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            line-height: 1.6;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .performance-bar {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .perf-metric {
            flex: 1;
        }

        .perf-metric h4 {
            font-size: 0.9rem;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .perf-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .frameworks-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 600px;
        }

        .framework-section {
            padding: 40px;
            position: relative;
        }

        .framework-section:first-child {
            border-right: 2px solid #ecf0f1;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: white;
        }

        .framework-section:last-child {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            color: white;
        }

        .framework-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .framework-title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .framework-subtitle {
            font-size: 1rem;
            opacity: 0.8;
        }

        .components-grid {
            display: grid;
            gap: 30px;
        }

        .counter, .todo-list {
            background: rgba(255, 255, 255, 0.95);
            color: #2c3e50;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .counter h3, .todo-list h3 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            text-align: center;
            color: #2c3e50;
            font-weight: 600;
        }

        .counter-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .counter-display button {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .counter-display button:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
        }

        .count {
            font-size: 2rem;
            font-weight: bold;
            color: #2c3e50;
            min-width: 60px;
            text-align: center;
        }

        .todo-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .todo-input input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .todo-input input:focus {
            outline: none;
            border-color: #6c5ce7;
        }

        .todo-input button {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .todo-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 184, 148, 0.4);
        }

        .todos {
            list-style: none;
            margin-bottom: 20px;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .todo-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .todo-item.completed {
            opacity: 0.6;
            text-decoration: line-through;
        }

        .todo-item span {
            cursor: pointer;
            flex: 1;
            padding: 5px;
        }

        .todo-item button {
            background: linear-gradient(135deg, #e17055, #d63031);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .todo-item button:hover {
            transform: scale(1.05);
            box-shadow: 0 3px 10px rgba(214, 48, 49, 0.4);
        }

        .todo-stats {
            text-align: center;
            font-size: 0.9rem;
            color: #6c757d;
            font-weight: 500;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #6c757d;
        }

        @media (max-width: 768px) {
            .frameworks-container {
                grid-template-columns: 1fr;
            }
            
            .framework-section:first-child {
                border-right: none;
                border-bottom: 2px solid #ecf0f1;
            }
            
            .performance-bar {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1>🦊 FnecJS vs ⚛️ React</h1>
            <p>Side-by-side comparison of FnecJS and React frameworks</p>
            <div class="performance-bar">
                <div class="perf-metric">
                    <h4>FnecJS Render Time</h4>
                    <div class="perf-value" id="fnec-time">--ms</div>
                </div>
                <div class="perf-metric">
                    <h4>React Render Time</h4>
                    <div class="perf-value" id="react-time">--ms</div>
                </div>
                <div class="perf-metric">
                    <h4>Bundle Size Diff</h4>
                    <div class="perf-value" id="bundle-diff">~%</div>
                </div>
            </div>
        </div>
        
        <div class="frameworks-container">
            <div class="framework-section">
                <div class="framework-header">
                    <div class="framework-title">🦊 FnecJS</div>
                    <div class="framework-subtitle">Lightweight & Fast</div>
                </div>
                <div class="components-grid">
                    <div id="fnec-root" class="loading">Loading FnecJS...</div>
                </div>
            </div>
            
            <div class="framework-section">
                <div class="framework-header">
                    <div class="framework-title">⚛️ React</div>
                    <div class="framework-subtitle">Industry Standard</div>
                </div>
                <div class="components-grid">
                    <div id="react-root" class="loading">Loading React...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Performance tracking
        const performanceTracker = {
            fnecStartTime: 0,
            reactStartTime: 0,
            
            startFnecTimer() {
                this.fnecStartTime = performance.now();
            },
            
            endFnecTimer() {
                const endTime = performance.now();
                const renderTime = (endTime - this.fnecStartTime).toFixed(2);
                document.getElementById('fnec-time').textContent = renderTime + 'ms';
                return renderTime;
            },
            
            startReactTimer() {
                this.reactStartTime = performance.now();
            },
            
            endReactTimer() {
                const endTime = performance.now();
                const renderTime = (endTime - this.reactStartTime).toFixed(2);
                document.getElementById('react-time').textContent = renderTime + 'ms';
                return renderTime;
            }
        };
        
        window.performanceTracker = performanceTracker;
    </script>
</body>
</html>
